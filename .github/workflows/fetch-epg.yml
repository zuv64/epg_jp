name: Fetch J:COM EPG

on:
  schedule:
    # JST 0,2,4,...,22時の2時間おき(12回/日) = 4バッチ(1セット)を8時間ごとに3セット回す
    - cron: '0 */2 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: fetch-epg
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Fetch EPG batch
        shell: pwsh
        run: ./scripts/fetch-epg.ps1

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update EPG data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
