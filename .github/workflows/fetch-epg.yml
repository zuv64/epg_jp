name: Fetch J:COM EPG

on:
  schedule:
    # 毎時0分はGitHub Actions側の高負荷時間帯で遅延・間引きされやすいため回避。
    # 1時間に5回(10,20,30,40,50分)発火し、BatchSize=40で1周(2317タスク)を約11.6時間に収め、1日2周回す。
    - cron: '10,20,30,40,50 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: fetch-epg
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Fetch EPG batch
        shell: pwsh
        run: ./scripts/fetch-epg.ps1

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update EPG data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            for i in 1 2 3 4 5; do
              if git push; then
                break
              fi
              echo "push rejected, retrying after rebase ($i)"
              git pull --rebase origin main
            done
          fi
